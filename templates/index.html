<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="pageTitle">出库核对系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; padding: 10px; }
        .container { max-width: 600px; margin: 0 auto; }
        .upload-area { border: 2px dashed #ccc; border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; }
        .upload-area.dragover { border-color: #0d6efd; background-color: #e7f1ff; }
        .recipient-btn { margin: 4px; font-size: 1.1rem; padding: 10px 18px; min-width: 70px; }
        .recipient-btn .badge { font-size: 0.9rem; }
        .card-item .card-header { background-color: #fff; }
        .serial-item { display: inline-block; margin: 3px 8px 3px 0; font-size: 0.9rem; }
        .serial-item .status.scanned { color: green; font-weight: bold; }
        .serial-item .status.pending { color: #ccc; }
        .progress { height: 28px; }
        .progress-bar { background-color: #0d6efd; font-size: 0.9rem; line-height: 28px; }
        .scan-result { margin-top: 10px; font-size: 1.0rem; }
        #scannedList .list-group-item { font-size: 0.9rem; padding: 8px 14px; }
        .card-header .progress-small { width: 90px; display: inline-block; margin-left: 10px; }
        .card-header .badge.bg-info { font-size: 0.85rem; }
        .collapse-toggle { cursor: pointer; user-select: none; }
        .collapse-toggle:hover { background-color: #e9ecef; }
        #scanInput { font-size: 1.4rem; height: 60px; padding: 10px 15px; }
        .btn-outline-secondary { font-size: 1.2rem; padding: 10px 20px; }
        .btn-export { font-size: 1.0rem; padding: 8px 16px; }
        .reset-master-btn { font-size: 0.8rem; padding: 2px 8px; }
        .lang-btn { cursor: pointer; font-size: 0.9rem; margin-left: 8px; }
        .lang-btn.active { font-weight: bold; text-decoration: underline; }
        input[type="date"] { font-size: 1.1rem; padding: 8px 10px; height: 44px; width: 140px; }
        .date-label { font-size: 1.0rem; }
        .progress-row { margin-bottom: 6px; }
        .date-row { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
        .scanner-name-display { cursor: pointer; color: #0d6efd; text-decoration: underline; font-size: 0.9rem; }
        .dropdown-menu { min-width: 200px; }
        @media (max-width: 480px) {
            .container { padding: 5px; }
            h4 { font-size: 1.2rem; }
            .recipient-btn { font-size: 0.9rem; padding: 6px 12px; min-width: 60px; }
            .recipient-btn .badge { font-size: 0.7rem; }
            .serial-item { font-size: 0.75rem; margin: 2px 5px; }
            .card-header { padding: 4px 8px; }
            .card-body { padding: 4px; }
            #scanInput { font-size: 1.1rem; height: 48px; padding: 6px 10px; }
            .btn-outline-secondary { font-size: 0.9rem; padding: 6px 12px; }
            .btn-export { font-size: 0.8rem; padding: 4px 10px; }
            .progress { height: 22px; }
            .progress-bar { font-size: 0.7rem; line-height: 22px; }
            input[type="date"] { font-size: 0.85rem; height: 36px; padding: 4px 6px; width: 110px; }
            .date-label { font-size: 0.8rem; }
            .date-row { gap: 4px; }
            .upload-section { display: none !important; }
            .pda-hint { display: block !important; }
            .lang-btn { font-size: 0.7rem; }
            .scanner-name-display { font-size: 0.7rem; }
            .reset-master-btn { font-size: 0.65rem; padding: 0 4px; }
            .card-header .progress-small { width: 60px; }
            .card-header .badge.bg-info { font-size: 0.7rem; }
            .dropdown-menu { min-width: 160px; }
        }
        .pda-hint { display: none; }
    </style>
</head>
<body>

    <!-- 扫描员登录模态框 -->
    <div class="modal fade" id="scannerModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalScannerTitle">👤 请输入扫描员姓名</h5>
                </div>
                <div class="modal-body">
                    <input type="text" class="form-control" id="scannerNameInput" placeholder="输入姓名" autofocus>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary w-100" id="scannerConfirmBtn">确认</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <h4 class="mb-3 text-center">
            <span id="headerTitle">📦 出库核对系统</span>
            <span style="font-size:0.9rem; margin-left:12px;">
                <span class="lang-btn" data-lang="zh" id="langZh">中文</span>
                <span class="lang-btn" data-lang="es" id="langEs">Español</span>
            </span>
            <span class="badge bg-info scanner-name-display" id="scannerNameDisplay" style="margin-left:12px;">点击设置姓名</span>
        </h4>

        <!-- 上传区域（电脑可见，PDA隐藏） -->
        <div class="row mb-3 upload-section">
            <div class="col-12">
                <div class="upload-area" id="uploadArea">
                    <p class="lead" style="font-size:1.1rem;" id="uploadPrompt">点击上传出库表</p>
                    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none;">
                    <button class="btn btn-primary btn-sm" id="uploadBtn">选择文件</button>
                    <span id="fileName" class="ms-2"></span>
                </div>
                <div id="uploadStatus" class="mt-1"></div>
            </div>
        </div>

        <!-- PDA 提示（加载失败时会变为红色错误信息） -->
        <div class="alert alert-info pda-hint text-center" role="alert" id="pdaHint">
            📤 请先在电脑端上传出库表
        </div>

        <!-- 收件人 -->
        <div class="row mb-3" id="recipientSection" style="display:none;">
            <div class="col-12">
                <div class="d-flex flex-wrap gap-1" id="recipientList"></div>
                <div id="selectedRecipient" class="mt-1 fw-bold" style="font-size:1.0rem;"></div>
            </div>
        </div>

        <!-- 全局进度 -->
        <div id="globalProgress" style="display:none;" class="mb-3">
            <div class="d-flex justify-content-between align-items-center progress-row">
                <span class="fw-bold" style="font-size:1.0rem;" id="progressLabel">全局进度</span>
                <span style="font-size:1.0rem;" id="progressText">0 / 0</span>
                <span style="font-size:1.0rem; font-weight:bold;" id="progressPercent">0%</span>
            </div>
            <div class="progress">
                <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%;"></div>
            </div>
            <!-- 日期行 + 下拉菜单 -->
            <div class="date-row">
                <span class="date-label" id="startDateLabel">起始日：</span>
                <input type="date" id="startDate" class="form-control form-control-sm">
                <span class="date-label">~</span>
                <span class="date-label" id="endDateLabel">结束日：</span>
                <input type="date" id="endDate" class="form-control form-control-sm">
                
                <!-- 下拉菜单代替独立按钮 -->
                <div class="dropdown">
                    <button class="btn btn-outline-primary btn-sm dropdown-toggle" type="button" id="exportDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        📥 导出
                    </button>
                    <ul class="dropdown-menu" aria-labelledby="exportDropdown">
                        <li><a class="dropdown-item" href="#" id="exportChecklist">📋 导出复核清单（含扫描状态）</a></li>
                        <li><a class="dropdown-item" href="#" id="exportHistory">📜 导出历史记录（所有扫描记录）</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- 扫码校验 -->
        <div class="mb-3" id="scanSection" style="display:none;">
            <div class="input-group">
                <input type="text" class="form-control" id="scanInput" placeholder="扫描箱标（自动识别）" autofocus>
                <button class="btn btn-outline-secondary" id="scanBtn">手动校验</button>
            </div>
            <div id="scanResult" class="scan-result"></div>
        </div>

        <!-- 复核清单 -->
        <div class="mb-3" id="checklistSection" style="display:none;">
            <div class="card">
                <div class="card-header collapse-toggle" data-bs-toggle="collapse" data-bs-target="#checklistCollapse">
                    <span class="fw-bold" style="font-size:1.1rem;" id="checklistTitle">📋 复核清单</span>
                    <span class="badge bg-secondary float-end" style="font-size:0.9rem;" id="checklistCount">0 箱</span>
                </div>
                <div id="checklistCollapse" class="collapse show">
                    <div class="card-body" id="checklistContainer" style="max-height:350px; overflow-y:auto; padding:10px;"></div>
                </div>
            </div>
        </div>

        <!-- 已扫描记录 -->
        <div class="mb-3" id="historySection" style="display:none;">
            <div class="card">
                <div class="card-header collapse-toggle" data-bs-toggle="collapse" data-bs-target="#historyCollapse">
                    <span class="fw-bold" style="font-size:1.1rem;" id="historyTitle">✅ 已扫描记录</span>
                    <span class="badge bg-success float-end" style="font-size:0.9rem;" id="scannedCountBadge">0</span>
                </div>
                <div id="historyCollapse" class="collapse show">
                    <div class="card-body" style="padding:6px;">
                        <ul id="scannedList" class="list-group" style="max-height:250px; overflow-y:auto;"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ============================================================
        // 1. 语言字典
        // ============================================================
        const LANG = {
            zh: {
                pageTitle: '出库核对系统',
                headerTitle: '📦 出库核对系统',
                uploadPrompt: '点击上传出库表',
                uploadBtn: '选择文件',
                pdaHint: '📤 请先在电脑端上传出库表',
                modalScannerTitle: '👤 请输入扫描员姓名',
                scannerPlaceholder: '输入姓名',
                scannerConfirm: '确认',
                scannerNameClick: '点击设置姓名',
                progressLabel: '全局进度',
                startDateLabel: '起始日：',
                endDateLabel: '结束日：',
                scanInputPlaceholder: '扫描箱标（自动识别）',
                scanBtn: '手动校验',
                checklistTitle: '📋 复核清单',
                historyTitle: '✅ 已扫描记录',
                noRecords: '暂无记录',
                resetBtn: '🔄重置',
                confirmReset: '确认重置主码 {master} 的所有扫描记录吗？\n此操作不可撤销！',
                resetSuccess: '主码 {master} 已重置',
                resetFailed: '重置失败，请重试',
                scanSuccess: '扫描成功',
                scanInvalid: '无效条码',
                scanAlready: '已扫过',
                scanPleaseInput: '请输入条码',
                scanPleaseSelectRecipient: '请先选择收件人',
                scanPleaseSetScanner: '请先设置扫描员姓名',
                scanNetworkError: '网络错误',
                noData: '暂无数据',
                noRecipient: '该收件人无复核数据',
                selectRecipientHint: '请点击上方收件人',
                currentRecipient: '当前：',
                tipo: '类型',
                totalBoxes: '总箱数',
                barcode: '条码',
                status: '扫描状态',
                scanned: '已扫',
                unscanned: '未扫',
                confirmDelete: '此操作不可撤销！',
                exportChecklist: '📋 导出复核清单（含扫描状态）',
                exportHistory: '📜 导出历史记录（所有扫描记录）',
            },
            es: {
                pageTitle: 'Sistema de Verificación de Envíos',
                headerTitle: '📦 Sistema de Verificación de Envíos',
                uploadPrompt: 'Haga clic para cargar la tabla de envíos',
                uploadBtn: 'Seleccionar archivo',
                pdaHint: '📤 Cargue primero la tabla de envíos desde la computadora',
                modalScannerTitle: '👤 Ingrese el nombre del escáner',
                scannerPlaceholder: 'Ingrese su nombre',
                scannerConfirm: 'Confirmar',
                scannerNameClick: 'Haga clic para configurar nombre',
                progressLabel: 'Progreso global',
                startDateLabel: 'Fecha inicio:',
                endDateLabel: 'Fecha fin:',
                scanInputPlaceholder: 'Escanear código (automático)',
                scanBtn: 'Verificar manual',
                checklistTitle: '📋 Lista de verificación',
                historyTitle: '✅ Registros escaneados',
                noRecords: 'Sin registros',
                resetBtn: '🔄Restablecer',
                confirmReset: '¿Confirmar restablecer todos los registros del código maestro {master}?\n¡Esta acción no se puede deshacer!',
                resetSuccess: 'Código maestro {master} restablecido',
                resetFailed: 'Error al restablecer, intente de nuevo',
                scanSuccess: 'Escaneo exitoso',
                scanInvalid: 'Código inválido',
                scanAlready: 'Ya escaneado',
                scanPleaseInput: 'Ingrese el código',
                scanPleaseSelectRecipient: 'Seleccione primero el destinatario',
                scanPleaseSetScanner: 'Configure primero el nombre del escáner',
                scanNetworkError: 'Error de red',
                noData: 'Sin datos',
                noRecipient: 'Este destinatario no tiene datos de verificación',
                selectRecipientHint: 'Haga clic en el destinatario arriba',
                currentRecipient: 'Actual:',
                tipo: 'Tipo',
                totalBoxes: 'Total cajas',
                barcode: 'Código',
                status: 'Estado',
                scanned: 'Escaneado',
                unscanned: 'No escaneado',
                confirmDelete: '¡Esta acción no se puede deshacer!',
                exportChecklist: '📋 Exportar lista de verificación (con estado)',
                exportHistory: '📜 Exportar historial de escaneos',
            }
        };

        let currentLang = 'zh';

        // ============================================================
        // 2. 语言切换
        // ============================================================
        function applyLanguage(lang) {
            currentLang = lang;
            const dict = LANG[lang];
            document.getElementById('pageTitle').textContent = dict.pageTitle;
            document.getElementById('headerTitle').textContent = dict.headerTitle;
            document.getElementById('uploadPrompt').textContent = dict.uploadPrompt;
            document.getElementById('uploadBtn').textContent = dict.uploadBtn;
            document.getElementById('pdaHint').textContent = dict.pdaHint;
            document.getElementById('modalScannerTitle').textContent = dict.modalScannerTitle;
            document.getElementById('scannerNameInput').placeholder = dict.scannerPlaceholder;
            document.getElementById('scannerConfirmBtn').textContent = dict.scannerConfirm;
            document.getElementById('scannerNameDisplay').textContent = '👤 ' + (scannerName || dict.scannerNameClick);
            document.getElementById('progressLabel').textContent = dict.progressLabel;
            document.getElementById('startDateLabel').textContent = dict.startDateLabel;
            document.getElementById('endDateLabel').textContent = dict.endDateLabel;
            document.getElementById('scanInput').placeholder = dict.scanInputPlaceholder;
            document.getElementById('scanBtn').textContent = dict.scanBtn;
            document.getElementById('checklistTitle').textContent = dict.checklistTitle;
            document.getElementById('historyTitle').textContent = dict.historyTitle;
            // 更新下拉菜单文字（直接修改 innerHTML，因为它们是固定 id）
            document.getElementById('exportChecklist').innerHTML = dict.exportChecklist;
            document.getElementById('exportHistory').innerHTML = dict.exportHistory;

            document.getElementById('langZh').className = 'lang-btn' + (lang === 'zh' ? ' active' : '');
            document.getElementById('langEs').className = 'lang-btn' + (lang === 'es' ? ' active' : '');

            if (currentRecipient && allItemsMap[currentRecipient]) {
                const items = allItemsMap[currentRecipient] || [];
                renderChecklist(items);
            }
            updateScannedList();
            if (currentRecipient) {
                document.getElementById('selectedRecipient').textContent = dict.currentRecipient + ' ' + currentRecipient;
            }
            localStorage.setItem('preferredLang', lang);
        }

        // ============================================================
        // 3. 全局变量
        // ============================================================
        let uploadedData = null;
        let currentRecipient = null;
        let scannedBarcodes = new Set();
        let allItemsMap = {};
        let itemBarcodeMap = {};
        let autoScanTimer = null;
        let pollInterval = null;
        let scannerName = '';

        // ============================================================
        // 4. 扫描员登录
        // ============================================================
        function checkScannerName() {
            const saved = localStorage.getItem('scannerName');
            if (saved && saved.trim() !== '') {
                scannerName = saved.trim();
                document.getElementById('scannerNameDisplay').textContent = '👤 ' + scannerName;
                return true;
            } else {
                const modal = new bootstrap.Modal(document.getElementById('scannerModal'), { backdrop: 'static', keyboard: false });
                modal.show();
                document.getElementById('scannerNameInput').focus();
                return false;
            }
        }

        document.getElementById('scannerConfirmBtn').addEventListener('click', function() {
            const name = document.getElementById('scannerNameInput').value.trim();
            if (name === '') {
                alert(LANG[currentLang].scannerPlaceholder + ' no puede estar vacío');
                return;
            }
            scannerName = name;
            localStorage.setItem('scannerName', name);
            document.getElementById('scannerNameDisplay').textContent = '👤 ' + name;
            bootstrap.Modal.getInstance(document.getElementById('scannerModal')).hide();
        });

        document.getElementById('scannerNameInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('scannerConfirmBtn').click();
            }
        });

        document.getElementById('scannerNameDisplay').addEventListener('click', function() {
            const newName = prompt('请输入新的扫描员姓名：', scannerName);
            if (newName !== null && newName.trim() !== '') {
                scannerName = newName.trim();
                localStorage.setItem('scannerName', scannerName);
                document.getElementById('scannerNameDisplay').textContent = '👤 ' + scannerName;
            }
        });

        // ============================================================
        // 5. 语言切换绑定 & 初始加载
        // ============================================================
        document.getElementById('langZh').addEventListener('click', function() { applyLanguage('zh'); });
        document.getElementById('langEs').addEventListener('click', function() { applyLanguage('es'); });

        const savedLang = localStorage.getItem('preferredLang') || 'zh';
        applyLanguage(savedLang);

        // ============================================================
        // 6. 上传功能
        // ============================================================
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileName = document.getElementById('fileName');
        const uploadStatus = document.getElementById('uploadStatus');

        uploadBtn.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length) {
                fileInput.files = files;
                handleFileUpload();
            }
        });

        fileInput.addEventListener('change', handleFileUpload);

        function handleFileUpload() {
            const file = fileInput.files[0];
            if (!file) return;
            fileName.textContent = file.name;
            const formData = new FormData();
            formData.append('file', file);

            uploadStatus.innerHTML = '<div class="spinner-border spinner-border-sm" role="status"></div> 上传中...';

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                uploadStatus.innerHTML = '';
                if (data.success) {
                    uploadedData = data;
                    buildMaps();
                    displayRecipients(data.recipients);
                    document.getElementById('recipientSection').style.display = 'block';
                    document.getElementById('checklistSection').style.display = 'none';
                    document.getElementById('historySection').style.display = 'none';
                    document.getElementById('scanSection').style.display = 'none';
                    document.getElementById('globalProgress').style.display = 'none';
                    document.getElementById('selectedRecipient').textContent = LANG[currentLang].selectRecipientHint;
                    scannedBarcodes.clear();
                    updateScannedList();
                    document.getElementById('scanResult').innerHTML = '';
                    if (pollInterval) clearInterval(pollInterval);
                    pollInterval = null;
                } else {
                    uploadStatus.innerHTML = `<div class="alert alert-danger">上传失败：${data.error}</div>`;
                }
            })
            .catch(err => {
                uploadStatus.innerHTML = `<div class="alert alert-danger">${LANG[currentLang].scanNetworkError}</div>`;
            });
        }

        function buildMaps() {
            allItemsMap = {};
            itemBarcodeMap = {};
            for (const rec in uploadedData.data) {
                const items = uploadedData.data[rec].all_items || [];
                allItemsMap[rec] = items;
                const map = {};
                items.forEach((item, idx) => {
                    item.serials.forEach(code => {
                        map[code] = idx;
                    });
                });
                itemBarcodeMap[rec] = map;
            }
        }

        // ============================================================
        // 7. 显示收件人
        // ============================================================
        function displayRecipients(recipients) {
            const list = document.getElementById('recipientList');
            list.innerHTML = '';
            recipients.forEach(rec => {
                const items = allItemsMap[rec] || [];
                const totalBoxes = items.reduce((sum, item) => sum + item.total_boxes, 0);
                const btn = document.createElement('button');
                btn.className = 'btn btn-outline-primary recipient-btn';
                btn.innerHTML = `${rec} <span class="badge bg-secondary">0/${totalBoxes}</span>`;
                btn.dataset.recipient = rec;
                btn.addEventListener('click', () => {
                    selectRecipient(rec);
                });
                list.appendChild(btn);
            });
        }

        function selectRecipient(recipient) {
            currentRecipient = recipient;
            document.getElementById('selectedRecipient').textContent = LANG[currentLang].currentRecipient + ' ' + recipient;
            scannedBarcodes.clear();
            document.getElementById('checklistSection').style.display = 'block';
            document.getElementById('historySection').style.display = 'block';
            document.getElementById('scanSection').style.display = 'block';
            document.getElementById('globalProgress').style.display = 'block';

            fetchStatus(recipient);
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(() => {
                fetchStatus(recipient);
            }, 2000);

            const items = allItemsMap[recipient] || [];
            renderChecklist(items);
            updateScannedList();
            document.getElementById('scanResult').innerHTML = '';
            document.getElementById('scanInput').value = '';
            document.getElementById('scanInput').focus();
            updateGlobalProgress();
            updateRecipientBadge(recipient);
            setDefaultDates();
        }

        // ============================================================
        // 8. 获取状态、渲染清单
        // ============================================================
        function fetchStatus(recipient) {
            if (!recipient) return;
            fetch(`/status/${recipient}`)
                .then(res => res.json())
                .then(data => {
                    if (data.scanned) {
                        const newSet = new Set(data.scanned.map(item => item.barcode));
                        scannedBarcodes = newSet;
                        updateAllAfterStatus();
                    }
                })
                .catch(err => console.error('获取状态失败', err));
        }

        function updateAllAfterStatus() {
            const items = allItemsMap[currentRecipient] || [];
            renderChecklist(items);
            updateScannedList();
            updateGlobalProgress();
            updateRecipientBadge(currentRecipient);
        }

        function renderChecklist(items) {
            const container = document.getElementById('checklistContainer');
            const countLabel = document.getElementById('checklistCount');
            const dict = LANG[currentLang];
            if (!items || items.length === 0) {
                container.innerHTML = `<div class="alert alert-warning small">${dict.noData}</div>`;
                countLabel.textContent = '0 ' + dict.totalBoxes;
                return;
            }
            let totalBoxes = 0;
            let html = '';
            items.forEach((item) => {
                totalBoxes += item.total_boxes;
                let serialsHtml = '';
                item.serials.forEach(code => {
                    const scanned = scannedBarcodes.has(code);
                    const symbol = scanned ? '✅' : '○';
                    serialsHtml += `<span class="serial-item"><span class="status ${scanned ? 'scanned' : 'pending'}">${symbol} ${code}</span></span>`;
                });
                const scannedCount = item.serials.filter(c => scannedBarcodes.has(c)).length;
                const total = item.total_boxes;
                const progressPercentVal = total > 0 ? Math.round((scannedCount / total) * 100) : 0;

                html += `
                    <div class="card card-item mb-2" data-master="${item.master_code}">
                        <div class="card-header py-1 d-flex justify-content-between align-items-center">
                            <div>
                                <strong style="font-size:0.95rem;">${item.master_code}</strong>
                                <span class="badge bg-secondary ms-1">${item.type}</span>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <span class="badge bg-info">${scannedCount}/${total}</span>
                                <div class="progress-small">
                                    <div class="progress" style="height:10px; width:80px; display:inline-block;">
                                        <div class="progress-bar" role="progressbar" style="width: ${progressPercentVal}%;"></div>
                                    </div>
                                </div>
                                <button class="btn btn-outline-danger btn-sm reset-master-btn" data-master="${item.master_code}">${dict.resetBtn}</button>
                            </div>
                        </div>
                        <div class="card-body" style="padding:6px; max-height:140px; overflow-y:auto;">
                            ${serialsHtml}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            countLabel.textContent = `${totalBoxes} ${dict.totalBoxes}`;

            document.querySelectorAll('.reset-master-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const masterCode = this.dataset.master;
                    resetMasterCode(masterCode);
                });
            });
        }

        // ---------- 重置主码 ----------
        function resetMasterCode(masterCode) {
            const dict = LANG[currentLang];
            if (!currentRecipient) {
                alert(dict.scanPleaseSelectRecipient);
                return;
            }
            if (!confirm(dict.confirmReset.replace('{master}', masterCode))) {
                return;
            }

            fetch(`/reset_master/${encodeURIComponent(currentRecipient)}/${encodeURIComponent(masterCode)}`, {
                method: 'POST'
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert(dict.resetSuccess.replace('{master}', masterCode));
                    fetchStatus(currentRecipient);
                } else {
                    alert(dict.resetFailed);
                }
            })
            .catch(err => {
                alert(dict.scanNetworkError);
                console.error(err);
            });
        }

        // ---------- 更新徽章和进度 ----------
        function updateRecipientBadge(recipient) {
            const items = allItemsMap[recipient] || [];
            const total = items.reduce((sum, item) => sum + item.total_boxes, 0);
            const scannedTotal = items.reduce((sum, item) => sum + item.serials.filter(c => scannedBarcodes.has(c)).length, 0);
            const btns = document.querySelectorAll('.recipient-btn');
            for (const btn of btns) {
                if (btn.dataset.recipient === recipient) {
                    const badge = btn.querySelector('.badge');
                    if (badge) {
                        badge.textContent = `${scannedTotal}/${total}`;
                        badge.className = 'badge bg-secondary';
                    }
                    break;
                }
            }
            updateGlobalProgress();
        }

        function updateGlobalProgress() {
            if (!currentRecipient) return;
            const items = allItemsMap[currentRecipient] || [];
            const total = items.reduce((sum, item) => sum + item.total_boxes, 0);
            const scannedTotal = items.reduce((sum, item) => sum + item.serials.filter(c => scannedBarcodes.has(c)).length, 0);
            if (total === 0) {
                document.getElementById('globalProgress').style.display = 'none';
                return;
            }
            document.getElementById('globalProgress').style.display = 'block';
            document.getElementById('progressText').textContent = `${scannedTotal} / ${total}`;
            const percent = total > 0 ? Math.round((scannedTotal / total) * 100) : 0;
            document.getElementById('progressPercent').textContent = percent + '%';
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressBar').className = 'progress-bar';
        }

        function setDefaultDates() {
            const today = new Date().toISOString().split('T')[0];
            const start = document.getElementById('startDate');
            const end = document.getElementById('endDate');
            if (!start.value) start.value = today;
            if (!end.value) end.value = today;
        }

        // ---------- 扫描 ----------
        function performScan() {
            const dict = LANG[currentLang];
            const barcode = document.getElementById('scanInput').value.trim();
            if (!barcode) {
                document.getElementById('scanResult').innerHTML = `<div class="alert alert-warning">${dict.scanPleaseInput}</div>`;
                return false;
            }
            if (!currentRecipient) {
                document.getElementById('scanResult').innerHTML = `<div class="alert alert-danger">${dict.scanPleaseSelectRecipient}</div>`;
                return false;
            }
            if (!scannerName) {
                document.getElementById('scanResult').innerHTML = `<div class="alert alert-danger">${dict.scanPleaseSetScanner}</div>`;
                return false;
            }

            fetch('/scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    recipient: currentRecipient,
                    barcode: barcode,
                    scanner_name: scannerName
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    document.getElementById('scanResult').innerHTML = `<div class="alert alert-danger">❌ ${data.error}</div>`;
                    return;
                }
                if (data.match === false) {
                    document.getElementById('scanResult').innerHTML = `<div class="alert alert-danger">❌ ${dict.scanInvalid}</div>`;
                    return;
                }
                if (data.already_scanned) {
                    document.getElementById('scanResult').innerHTML = `<div class="alert alert-warning">⚠️ ${dict.scanAlready}</div>`;
                    return;
                }
                document.getElementById('scanResult').innerHTML = `<div class="alert alert-success">✅ ${dict.scanSuccess}</div>`;
                scannedBarcodes.add(barcode);
                updateAllAfterStatus();
                document.getElementById('scanInput').value = '';
                fetchStatus(currentRecipient);
            })
            .catch(err => {
                document.getElementById('scanResult').innerHTML = `<div class="alert alert-danger">${dict.scanNetworkError}</div>`;
            });

            return true;
        }

        // 自动扫描（80ms）
        document.getElementById('scanInput').addEventListener('input', function() {
            if (autoScanTimer) {
                clearTimeout(autoScanTimer);
                autoScanTimer = null;
            }
            autoScanTimer = setTimeout(() => {
                performScan();
                autoScanTimer = null;
            }, 80);
        });

        document.getElementById('scanBtn').addEventListener('click', function() {
            if (autoScanTimer) {
                clearTimeout(autoScanTimer);
                autoScanTimer = null;
            }
            performScan();
        });

        document.getElementById('scanInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (autoScanTimer) {
                    clearTimeout(autoScanTimer);
                    autoScanTimer = null;
                }
                performScan();
            }
        });

        // ---------- 已扫描记录 ----------
        function updateScannedList() {
            const list = document.getElementById('scannedList');
            const badge = document.getElementById('scannedCountBadge');
            const dict = LANG[currentLang];
            list.innerHTML = '';
            if (scannedBarcodes.size === 0) {
                list.innerHTML = `<li class="list-group-item text-muted">${dict.noRecords}</li>`;
                badge.textContent = '0';
                return;
            }
            const sorted = Array.from(scannedBarcodes).sort();
            sorted.forEach(code => {
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center';
                li.innerHTML = `${code} <span class="badge bg-success">✅</span>`;
                list.appendChild(li);
            });
            badge.textContent = sorted.length;
        }

        // ---------- 导出功能（下拉菜单） ----------
        function exportChecklist() {
            if (!currentRecipient) {
                alert(LANG[currentLang].scanPleaseSelectRecipient);
                return;
            }
            let url = `/export?recipient=${encodeURIComponent(currentRecipient)}`;
            const sDate = document.getElementById('startDate').value;
            const eDate = document.getElementById('endDate').value;
            if (sDate) url += `&start_date=${sDate}`;
            if (eDate) url += `&end_date=${eDate}`;
            window.location.href = url;
        }

        function exportHistory() {
            if (!currentRecipient) {
                alert(LANG[currentLang].scanPleaseSelectRecipient);
                return;
            }
            let url = `/export_history?recipient=${encodeURIComponent(currentRecipient)}`;
            const sDate = document.getElementById('startDate').value;
            const eDate = document.getElementById('endDate').value;
            if (sDate) url += `&start_date=${sDate}`;
            if (eDate) url += `&end_date=${eDate}`;
            window.location.href = url;
        }

        document.getElementById('exportChecklist').addEventListener('click', function(e) {
            e.preventDefault();
            exportChecklist();
        });
        document.getElementById('exportHistory').addEventListener('click', function(e) {
            e.preventDefault();
            exportHistory();
        });

        // 折叠时保持聚焦
        document.querySelectorAll('.collapse-toggle').forEach(el => {
            el.addEventListener('click', () => {
                setTimeout(() => document.getElementById('scanInput').focus(), 100);
            });
        });

        window.addEventListener('beforeunload', function() {
            if (pollInterval) clearInterval(pollInterval);
        });

        // ============================================================
        // 9. 页面加载时自动获取已有数据（增强错误提示）
        // ============================================================
        window.addEventListener('DOMContentLoaded', function() {
            fetch('/get_data')
                .then(res => {
                    if (!res.ok) {
                        throw new Error(`HTTP ${res.status}: ${res.statusText}`);
                    }
                    return res.json();
                })
                .then(data => {
                    if (data && data.success) {
                        uploadedData = data;
                        buildMaps();
                        displayRecipients(data.recipients);
                        document.getElementById('recipientSection').style.display = 'block';
                        document.getElementById('selectedRecipient').textContent = LANG[currentLang].selectRecipientHint;
                        scannedBarcodes.clear();
                        updateScannedList();
                        document.getElementById('scanResult').innerHTML = '';
                        const hint = document.getElementById('pdaHint');
                        hint.style.display = 'none';
                    } else {
                        throw new Error(data.message || '未知错误');
                    }
                })
                .catch(err => {
                    console.error('拉取数据失败', err);
                    const hint = document.getElementById('pdaHint');
                    hint.style.display = 'block';
                    hint.className = 'alert alert-danger text-center';
                    hint.innerHTML = `❌ 无法连接服务器：${err.message}<br>请检查网络或联系管理员。`;
                });
        });
    </script>
</body>
</html>
